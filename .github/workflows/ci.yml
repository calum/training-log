name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "progress.png"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Free runner disk (the Android build plus Robolectric is big): drop big toolchains we never use.
      # The Android SDK is kept. Never fails the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h / | tail -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug
      # Screenshots of every screen, for people to look at. Record-only: never compares, never fails the build.
      - name: Record screenshots
        continue-on-error: true
        run: ./gradlew :app:recordRoborazziDebug --no-daemon
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: ignore
          retention-days: 3
